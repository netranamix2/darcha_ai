- id: KB-017
  title: О регулировании выдачи образовательных кредитов
  kind: Постановление КМ
  number: '527'
  number_raw: '527'
  issued_at: '2021-08-18'
  status: active
  topics: kredit_na_obuchenie
  key_points: '[черновик Claude по тексту lex.uz — проверить]

    • Прил.1 п.1, п.3: кредит выдаётся гражданам Узбекистана, обучающимся на контракте по дневной форме бакалавриата и магистратуры (вкл. частные и иностранные вузы и их филиалы, срок обучения от 1 года);
    на иностранцев и лиц без гражданства не распространяется

    • Прил.1 п.2¹: с 2024/2025 уч. года для студентов 2 курса и выше при GPA ниже «3» — не более 80% контракта (после оплаты студентом первых 20%); при GPA «3» и выше и/или для семей из Социального реестра
    — 100% контракта

    • Прил.1 п.2⁴: детям из семей Социального реестра при GPA «3,5» и выше — беспроцентный кредит на следующий учебный год; п.18 «в»: залог и поручительство для них не требуются

    • Прил.1 п.3: кредит не выдаётся на дифференцированный контракт, на разовые платежи, равные его минимальному размеру, и на контракт в магистратуру госвузов по дополнительным параметрам приёма

    • Прил.1 п.4: основной долг возвращается в течение 7 лет начиная с 7-го месяца после окончания официального срока обучения; проценты начисляются с даты перечисления денег вузу

    • Прил.1 п.22: ставка равна основной ставке ЦБ; при её снижении ставка по кредиту снижается, при повышении — не меняется

    • Прил.1 п.17³, п.20: заявка — через my.gov.uz, ta''lim-krediti.mf.uz или напрямую в банк из списка на сайте Минэкономфина; банк рассматривает за 5 рабочих дней, отказ — письменно с указанием причины

    • Прил.1 п.26, п.28: при просрочке процентов или регулярных просрочках банк может отказать в следующей части кредита; досрочное погашение разрешено'
