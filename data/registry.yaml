- id: KB-035
  title: Перевод учеников из класса в класс и из школы в школу
  kind: Положение (рег. МЮ)
  number: '2684'
  number_raw: рег. 2684
  issued_at: '2015-06-17'
  status: active
  topics: shkola, perevod
  key_points: '[черновик Claude по тексту lex.uz — проверить]

    • Прил.1 п.6: перевод ученика из класса в класс и из школы в школу осуществляется бесплатно

    • Прил.1 п.7: родители вправе перевести ребёнка в параллельный класс по своему желанию в течение учебного года или после его окончания

    • Прил.1 п.8: для перевода в другой класс родители подают заявление на имя директора школы с указанием причин

    • Прил.1 п.9: директор рассматривает заявление в течение 1 рабочего дня; может отказать, если в классе превышена норма численности; об отказе сообщает письменно в течение 3 дней

    • Прил.1 п.11: перевод в другую школу возможен по желанию родителей в течение учебного года или после его окончания

    • Прил.1 п.12: для перевода в другую школу заявление с указанием причин подаётся директору школы, где учится ребёнок

    • Прил.1 п.13: заявление рассматривается за 1 рабочий день, выдаётся талон убытия для новой школы; в новой школе подают заявление с талоном и в тот же день получают талон прибытия (п.15)

    • Прил.1 п.16: после сдачи талона прибытия прежняя школа в тот же день отчисляет ученика и выдаёт выписку из приказа, табель успеваемости и медицинскую карту'
