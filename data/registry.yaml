- id: KB-032
  title: Грант одарённым студентам «Yangi O'zbekiston» и субсидия выпускникам Президентских школ
  kind: Постановление КМ
  number: '300'
  number_raw: '300'
  issued_at: '2022-06-02'
  status: active
  topics: grant, prezidentskie_shkoly
  key_points: '[черновик Claude по тексту lex.uz — проверить]

    • Прил.1 п.11: полный (100%) грант в университете «Yangi O''zbekiston» — выпускникам Президентских школ с дипломом/сертификатом IB, AP или International Advanced Levels; победителям IMO, IPhO, IChO,
    IBO, IOI, сдавшим вступительные экзамены; выпускникам творческих и специализированных школ Агентства в пределах квоты 5% от общих квот приёма; детям из семей, включённых в Социальный реестр

    • Прил.1 п.13: гражданам Узбекистана с высокими баллами на вступительных экзаменах и студентам с лучшей успеваемостью за прошлый учебный год грант даётся дифференцированно, на один учебный год

    • Прил.1 п.5, п.8: грант только для очной формы бакалавриата и магистратуры; отдельное заявление на грант не подаётся

    • Прил.1 п.7: подтверждающие документы прикладываются в PDF к заявлению на онлайн-платформе приёма в установленные сроки (кроме абитуриентов с высокими баллами); после окончания приёма изменения не
    вносятся

    • Прил.1 п.22: обладатели полного гранта обязаны не позднее 2 месяцев после окончания учёбы отработать до 5 лет по направлению Агентства; при частичном гранте срок отработки пропорционален, но не менее
    одного года

    • Прил.2 п.6: выпускники Президентских школ, поступившие на контракт в иностранные или негосударственные вузы Узбекистана, подают заявление в Агентство президентских образовательных учреждений до 15
    декабря учебного года, приложив справку о зачислении и договор-контракт

    • Прил.2 п.7: заявление рассматривается 3 рабочих дня; ежегодно возмещается сумма контракта, но не более 100 БРВ (если контракт меньше — полностью); пересдача и повторное обучение предметов оплачиваются
    студентом

    • Прил.2 п.8, п.9: получатель субсидии обязан не позднее 2 месяцев после окончания учёбы отработать до 5 лет по направлению Агентства; при невыполнении обязательств субсидия возвращается в бюджет пропорционально
    неотработанному сроку'
