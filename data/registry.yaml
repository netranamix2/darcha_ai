- id: KB-031
  title: О соцпомощи из фондов «Ayollar daftari», «Yoshlar daftari», «Saxovat va ko'mak»
  kind: Постановление КМ
  number: '462'
  number_raw: '462'
  issued_at: '2025-07-23'
  status: active
  topics: socialnaya_pomoshch
  key_points: '[черновик Claude по тексту lex.uz — проверить]

    • п.6, Прил.1: большая часть акта — изменения в постановления КМ №145 (2022, «Ayollar daftari»), №312 (2022, «Yoshlar daftari») и №313 (2024, «Saxovat va ko''mak»); по Прил.2 утратили силу постановления
    №122 и №566 (2023)

    • п.1: соцпомощь из трёх фондов получают семьи из Реестра малообеспеченных семей; помощь на жильё и лечение — также семьи с доходом не более 2 минимальных потребительских расходов на каждого члена семьи

    • п.2¹: деньги соцпомощи, выданные из фонда «Saxovat va ko''mak» семьям из «Ayollar daftari» или «Yoshlar daftari» до 1 января 2026 г., остаются у граждан

    • п.5: помощь из «Saxovat va ko''mak» по ваучеру через ИС «Yagona milliy ijtimoiy himoya» вводится с 15 августа 2025 г. как эксперимент в г. Ташкенте и районах Андижанской области

    • Прил.1 п.1: «Ayollar daftari» — для женщин старше 30 лет; компенсация аренды жилья 50%, но не более 2 БРВ (в Ташкенте, Нукусе и областных центрах — до 3 БРВ); на ремонт жилья — до 50 БРВ

    • Прил.1 п.2: «Yoshlar daftari» — молодёжь 14–30 лет; оплата 50% контракта в колледже/вузе, но не более 50 БРВ; курсы вождения — до 8 БРВ; аренда для молодых семей — 50%, до 2 БРВ (3 БРВ в Ташкенте,
    Нукусе, облцентрах) до 12 месяцев

    • Прил.1 п.2: заявление в «Yoshlar daftari» — через электронную платформу, call-центр «1093» или через лидера молодёжи махалли; «махаллинская семёрка» рассматривает за 5 рабочих дней, ответ приходит
    в т.ч. по SMS

    • Прил.1 п.3: в «Saxovat va ko''mak» «махаллинская семёрка» решает за 5 дней (срочно — за сутки); ваучер действует 2 месяца; лечение, аренда и ремонт не оплачиваются, если уже получены из «Ayollar/Yoshlar
    daftari» или других источников'
