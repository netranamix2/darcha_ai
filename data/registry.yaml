- id: KB-029
  title: О размерах и порядке назначения и выплаты стипендий
  kind: Постановление КМ
  number: '59'
  number_raw: '59'
  issued_at: '2020-01-31'
  status: active
  topics: stipendiya
  key_points: '[черновик Claude по тексту lex.uz — проверить]

    • Прил.1 п.6: стипендия грантникам по итогам семестра — только «отлично» (86+ баллов) +20% к базовой; если «удовлетворительно» (<71 балла) менее 30% оценок — базовая; 30% и более — стипендия не назначается
    на следующий семестр (кроме сирот на полном гособеспечении и инвалидов 1–2 группы)

    • Прил.1 п.5: первокурсникам до итогов 1-го семестра выплачивается базовая стипендия

    • Прил.1 п.7–9: контрактник сам выбирает стипендиальный или безстипендиальный контракт; в стипендиальный включена годовая сумма базовой стипендии, она платится ежемесячно независимо от оценок и только
    после оплаты контракта

    • Прил.1 п.13, 15: инвалидам 1–2 группы — стипендия на 50% выше базовой независимо от оценок; сиротам на полном гособеспечении — базовая, а также на 50% выше базовой за счёт Фонда поощрения студентов
    независимо от формы обучения

    • Прил.1 п.10²: девушкам-отличницам из семей в Социальном реестре — спецстипендия сверх обычной: «семья на гособеспечении» — 2 базовые, «малоимущая» и «на грани бедности» — 1 базовая; выплата на социальную
    карту, прекращается при потере оценок «отлично» или исключении семьи из реестра

    • Прил.1 п.20: победителям олимпиад/соревнований и в особых случаях (тяжёлая болезнь, смерть близких) — единовременная выплата до 10 базовых стипендий из Фонда

    • Прил.1 п.23, 25: при академической задолженности (менее 55% по предмету) без уважительной причины грантник лишается стипендии со следующего семестра; при болезни/уважительной причине — не лишается

    • Прил.1 п.28, 30: в академическом отпуске стипендия не платится; в декретном отпуске — полностью, в отпуске по уходу за ребёнком до 2 лет — не платится'
  source_url: https://www.lex.uz/ru/docs/-4725554
