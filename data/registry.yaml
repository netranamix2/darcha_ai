  title: Об утверждении НПА, регулирующих приём в вузы (приём в бакалавриат и магистратуру, перевод, восстановление, отчисление, академическая мобильность)
  kind: Постановление КМ
  number: '578'
  number_raw: '578'
  issued_at: '2025-09-13'
  status: active
  topics: perevod, vosstanovlenie, priyom, akademik_tatil, otchislenie, akademik_mobilnost
  key_points: '• Прил.3 п.14: перевод внутри страны 2 раза в год — 15 июля–5 августа (осень) и 10–20 января (весна); между вузами весной не переводят

    • Прил.3 п.14–15: заявление через сайт министерства или ЕПИГУ (электронная платформа)

    • На практике заявки на перевод и восстановление принимает платформа transfer.edu.uz (по данным nuu.uz и infoedu.uz); в тексте ПКМ — «официальный сайт министерства или ЕПИГУ»

    • Прил.3 п.18: рассмотрение 6–30 августа и 21 января–10 февраля

    • Прил.3 п.7–9: внутри вуза — приказ ректора; между вузами по родственным направлениям — министерство принимающего вуза; особые случаи — Госкомиссия

    • Прил.3 п.10: основания отказа (неаккредитованный иностранный вуз, нет мест, не оплачен контракт и др.)

    • Прил.3 п.11: разница не более 4 предметов; при кредитной системе GPA не ниже 2.4

    • Прил.3 п.41: согласие прежнего вуза не требуется

    • Прил.3 п.42–48: восстановление в те же окна; отчисленный в этом учебном году не восстанавливается на тот же курс в том же году

    • Прил.3 п.49: основания академ. отпуска и отчисления (в т.ч. >74 часов пропусков за семестр без уважительной причины)

    • Прил.4: академическая мобильность 1–2 семестра'
  source_url: https://lex.uz/ru/acts/-7726569
  status_note: Действует; на lex.uz редакция с изменениями по 30.06.2026. Приложение 6 отменило ПКМ №393 (2017) и №344 (2021, академ. отпуск) и ряд других постановлений.
